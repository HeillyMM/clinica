<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary fixed-top">
        <div class="container-fluid px-3">
            <a class="navbar-brand fw-semibold text-white" href="{{url_for('home')}}">MediWeb</a>
            <button class="btn btn-dark border-secondary rounded-circle py-1 px-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#menu">
                <i class="bi bi-list fs-5"></i>
            </button>
        </div>
    </nav>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="menu">
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title text-white">Menú</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column p-3">
            <ul class="navbar-nav gap-1 mb-auto">
                <li class="nav-item">
                    <a class="nav-link active rounded px-2" href="{{ url_for('medico.menu') }}"><i class="bi bi-house-door me-2"></i>Inicio</a>
                </li>
                <li class="nav-item">
                    <details>
                        <summary class="nav-link rounded px-2 d-flex justify-content-between align-items-center" style="list-style: none; cursor: pointer;">
                            <span><i class="bi bi-people me-2"></i>Médicos</span>
                            <i class="bi bi-chevron-down fs-7 opacity-50"></i>
                        </summary>
                        <a class="nav-link py-1 ps-4 rounded opacity-75 fs-6 mt-1" href="{{ url_for('medico.registrar') }}">
                            <i class="bi bi-person-plus me-2"></i>Agregar Médico
                        </a>
                    </details>
                </li>
            </ul>
            <a href="{{url_for('usuarios.logout')}}" class="btn btn-primary">cerrar sesión</a>
        </div>
    </div>

    <main class="container" style="margin-top: 80px;">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
