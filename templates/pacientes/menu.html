{% extends 'base.html' %}
{% block title %}Pacientes{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h4 text-white m-0 fw-semibold">Lista de Pacientes</h2>
    <a href="{{ url_for('paciente.crear') }}" class="btn btn-light fw-semibold">
        <i class="bi bi-person-plus me-1"></i> Agregar Paciente
    </a>
</div>

<div class="card bg-dark border-secondary shadow-sm">
    <div class="table-responsive">
        <table class="table table-dark table-hover align-middle mb-0">
            <thead>
                <tr class="text-muted border-secondary fs-7 text-uppercase">
                    <th class="ps-4">Paciente</th>
                    <th class="text-end pe-4">Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for paciente in pacientes %}
                <tr class="border-secondary">
                    <td class="ps-4 fw-medium text-white">{{ paciente.nombre }}</td>
                    <td class="text-end pe-4">
                        <div class="btn-group gap-2">
                            <a href="{{ url_for('paciente.actualizar', id=paciente.id_paciente) }}" class="btn btn-sm btn-outline-light border-secondary py-2 px-3">
                                <i class="bi bi-pencil"></i> <span class="d-none d-sm-inline ms-1">Editar</span>
                            </a>
                            <a href="{{ url_for('paciente.eliminar', id=paciente.id_paciente) }}" class="btn btn-sm btn-outline-danger py-2 px-3">
                                <i class="bi bi-trash"></i> <span class="d-none d-sm-inline ms-1">Eliminar</span>
                            </a>
                        </div>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="2" class="text-center text-muted py-4">No hay pacientes registrados.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
